services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ptn
      POSTGRES_PASSWORD: ptn
      POSTGRES_DB: phuthanhnam
    volumes:
      - ptn_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptn -d phuthanhnam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local Redis (prod dùng Upstash)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ptn_redis_data:/data

volumes:
  ptn_pg_data:
  ptn_redis_data:
